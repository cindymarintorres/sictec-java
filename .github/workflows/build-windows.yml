name: Build Windows Executable (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Compilar Frontend React
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Copiar Frontend a recursos estáticos de Spring Boot
        shell: bash
        run: |
          cp -r web/dist/* api/src/main/resources/static/

      - name: Compilar Spring Boot JAR
        run: |
          cd api
          ./gradlew.bat bootJar --no-daemon

      - name: Empaquetar a Instalador Windows (sictec-java.exe) con jpackage
        shell: bash
        run: |
          jpackage \
            --input api/build/libs \
            --name "sictec-java" \
            --main-jar api-0.0.1-SNAPSHOT.jar \
            --type exe \
            --win-dir-chooser \
            --win-menu \
            --win-shortcut \
            --java-options "-Xmx512m" \
            --dest release

      - name: Subir instalador como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: sictec-java-windows-installer
          path: release/*.exe
