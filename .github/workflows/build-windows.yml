name: Build Windows Executable (.exe)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          check-latest: true
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Compilar Frontend React
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Copiar Frontend a recursos estáticos de Spring Boot
        shell: bash
        run: |
          cp -r web/dist/* api/src/main/resources/static/

      - name: Compilar Spring Boot JAR
        run: |
          cd api
          ./gradlew.bat bootJar --no-daemon

      - name: Crear JRE de Windows autocontenido con jlink
        shell: bash
        run: |
          jlink \
            --no-header-files \
            --no-man-pages \
            --strip-debug \
            --add-modules java.se,jdk.unsupported \
            --output jre-win

      - name: Determinar versión de la aplicación
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="1.0.${{ github.run_number }}"
          fi
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "Versión calculada para el instalador: $VER"

      - name: Empaquetar a Instalador Windows (sictec-java.exe) con jpackage
        shell: bash
        run: |
          jpackage \
            --input api/build/libs \
            --name "sictec-java" \
            --app-version "${APP_VERSION}" \
            --win-upgrade-uuid "d3b07384-d113-4f93-b6c8-10076a9a7b78" \
            --main-jar api-0.0.1-SNAPSHOT.jar \
            --main-class org.springframework.boot.loader.launch.JarLauncher \
            --runtime-image jre-win \
            --icon api/src/main/resources/icon-sictec.ico \
            --type exe \
            --win-dir-chooser \
            --win-menu \
            --win-shortcut \
            --win-console \
            --java-options "-Xmx512m" \
            --dest release

      - name: Subir instalador como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: sictec-java-windows-installer
          path: release/*.exe
