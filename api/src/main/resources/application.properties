spring.application.name=sictec
server.port=8080

# Base de datos H2 en carpeta del usuario — funciona en Windows y Linux sin permisos de admin
# Windows: C:\Users\<usuario>\.sictec-java\data\sictec.mv.db
# Linux:   /home/<usuario>/.sictec-java/data/sictec.mv.db
spring.datasource.url=jdbc:h2:file:${user.home}/.sictec-java/data/sictec;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 para depuración en desarrollo (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SRI API Endpoint
sri.api.url=https://srienlinea.sri.gob.ec/sri-catastro-sujeto-servicio-internet/rest/ConsolidadoContribuyente